const VERSION="2026-hiking-only-v1";
try {
  if(localStorage.getItem("bruce-seed-version")!==VERSION){
    localStorage.setItem("bruce-v2-routes",JSON.stringify(seed));
    localStorage.setItem("bruce-seed-version",VERSION);
  }
} catch(e) {}

const frame=document.getElementById("tracker");
frame.addEventListener("load",()=>{
  const w=frame.contentWindow, d=w.document;
  if(!w.L || !w.map) return;

  const style=d.createElement("style");
  style.textContent=`
    .manual-on{background:#d97706!important;color:#fff!important;border-color:#d97706!important}
    .manual-start{background:#fff7ed;color:#9a3412;font-weight:700}
  `;
  d.head.appendChild(style);

  const controls=d.querySelector(".controls");
  const mark=d.createElement("button");
  mark.id="manualComplete";
  mark.textContent="✓ Mark trail complete";
  const undo=d.createElement("button");
  undo.id="undoManual";
  undo.textContent="Undo manual section";
  controls.insertBefore(mark, d.getElementById("reset"));
  controls.insertBefore(undo, d.getElementById("reset"));

  const MANUAL_KEY="bruce-manual-completed-v1";
  let manualPaths=[];
  try{ manualPaths=JSON.parse(localStorage.getItem(MANUAL_KEY)||"[]"); }catch(e){}
  let marking=false, start=null, preview=w.L.layerGroup().addTo(w.map);

  function segKey(s){
    const a=s.a.map(x=>Number(x).toFixed(6)).join(",");
    const b=s.b.map(x=>Number(x).toFixed(6)).join(",");
    return a<b ? a+"|"+b : b+"|"+a;
  }
  function manualSet(){
    const out=new Set();
    manualPaths.forEach(p=>p.keys.forEach(k=>out.add(k)));
    return out;
  }
  function saveManual(){
    localStorage.setItem(MANUAL_KEY,JSON.stringify(manualPaths));
  }
  function nearestVertex(ll){
    let best=null, bd=Infinity;
    for(const s of trail){
      for(const p of [s.a,s.b]){
        const dd=w.d([ll.lng,ll.lat],p);
        if(dd<bd){bd=dd;best=p;}
      }
    }
    return best;
  }
  function vkey(p){return Number(p[0]).toFixed(6)+","+Number(p[1]).toFixed(6)}
  function shortestPath(a,b){
    const adj=new Map();
    trail.forEach(s=>{
      const ka=vkey(s.a), kb=vkey(s.b), sk=segKey(s);
      if(!adj.has(ka))adj.set(ka,[]);
      if(!adj.has(kb))adj.set(kb,[]);
      adj.get(ka).push([kb,s.km,sk,s]);
      adj.get(kb).push([ka,s.km,sk,s]);
    });
    const startK=vkey(a), endK=vkey(b), dist=new Map([[startK,0]]), prev=new Map(), seen=new Set();
    while(true){
      let u=null, best=Infinity;
      for(const [k,val] of dist) if(!seen.has(k)&&val<best){best=val;u=k}
      if(u===null||u===endK)break;
      seen.add(u);
      for(const [v,km,sk,s] of (adj.get(u)||[])){
        const nd=best+km;
        if(nd<(dist.get(v)??Infinity)){dist.set(v,nd);prev.set(v,[u,sk,s]);}
      }
    }
    if(!prev.has(endK) && startK!==endK)return null;
    let cur=endK, keys=[], segs=[];
    while(cur!==startK){
      const p=prev.get(cur); if(!p)return null;
      keys.push(p[1]);segs.push(p[2]);cur=p[0];
    }
    keys.reverse();segs.reverse();
    return {keys,segs,km:segs.reduce((n,s)=>n+s.km,0)};
  }

  const originalRender=renderTrail;
  renderTrail=function(){
    if(!trailReady)return;
    remain.clearLayers();done.clearLayers();
    const G=gridify(), manual=manualSet();
    let total=0,covered=0,manualKm=0;
    for(const s of trail){
      total+=s.km;
      const byManual=manual.has(segKey(s));
      const c=byManual||near(s.mid,G)||near(s.a,G)||near(s.b,G);
      if(c){
        covered+=s.km;if(byManual)manualKm+=s.km;
        w.L.polyline([[s.a[1],s.a[0]],[s.b[1],s.b[0]]],{color:"#2f7d4a",weight:5,opacity:.9}).addTo(done);
      } else {
        w.L.polyline([[s.a[1],s.a[0]],[s.b[1],s.b[0]]],{color:"#9ca39d",weight:3,opacity:.75}).addTo(remain);
      }
    }
    const pct=total?covered/total*100:0;
    d.getElementById("done").textContent=covered.toFixed(1);
    d.getElementById("left").textContent=Math.max(0,total-covered).toFixed(1);
    d.getElementById("pct").textContent=pct.toFixed(1)+"%";
    d.getElementById("fill").style.width=pct+"%";
    d.getElementById("status").textContent="Trail loaded. "+routes.length+" GPS hikes + "+manualPaths.length+" manual section(s).";
  };

  mark.addEventListener("click",()=>{
    marking=!marking;start=null;preview.clearLayers();
    mark.classList.toggle("manual-on",marking);
    mark.textContent=marking?"Tap START of grey trail":"✓ Mark trail complete";
    d.getElementById("status").textContent=marking?"Manual mode: tap the START of the grey section you completed.":"Manual mode off.";
  });

  undo.addEventListener("click",()=>{
    if(!manualPaths.length){alert("No manually completed sections to undo.");return}
    const last=manualPaths.pop();saveManual();renderTrail();
    d.getElementById("status").textContent="Removed last manual section ("+last.km.toFixed(2)+" km).";
  });

  w.map.on("click",e=>{
    if(!marking)return;
    if(w.planning)return;
    if(!trailReady){alert("Wait for the Trail to finish loading.");return}
    const p=nearestVertex(e.latlng);
    if(!p)return;
    if(!start){
      start=p;preview.clearLayers();
      w.L.circleMarker([p[1],p[0]],{radius:7,color:"#d97706",fillColor:"#fff",fillOpacity:1,weight:3}).addTo(preview);
      mark.textContent="Tap END of grey trail";
      d.getElementById("status").textContent="Start selected. Now tap the END of the section.";
      return;
    }
    const path=shortestPath(start,p);
    if(!path||!path.keys.length){alert("I couldn't connect those two points along the Main Trail. Try endpoints a little closer.");start=null;preview.clearLayers();return}
    preview.clearLayers();
    w.L.polyline(path.segs.flatMap((s,i)=>i?[[s.b[1],s.b[0]]]:[[s.a[1],s.a[0]],[s.b[1],s.b[0]]]),{color:"#d97706",weight:7,opacity:.9}).addTo(preview);
    if(confirm("Mark this "+path.km.toFixed(2)+" km section complete?")){
      manualPaths.push({keys:path.keys,km:path.km,added:new Date().toISOString()});
      saveManual();renderTrail();
      d.getElementById("status").textContent="Added "+path.km.toFixed(2)+" km manually. It now counts toward your progress.";
    } else {
      d.getElementById("status").textContent="Manual section cancelled.";
    }
    start=null;marking=false;mark.classList.remove("manual-on");mark.textContent="✓ Mark trail complete";
    preview.clearLayers();
  });

  const wait=setInterval(()=>{
    if(trailReady){clearInterval(wait);renderTrail();}
  },250);
});
